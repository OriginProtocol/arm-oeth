name: ARM
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  schedule:
    # Daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger from GitHub UI

# security/LOW: scope GITHUB_TOKEN to read-only and remove the
# workflow-wide env export. Steps that genuinely need the token can
# pass it explicitly via `env:` on that step. Smallest viable scope
# for a read-mostly CI workflow.
permissions:
  contents: read

env:
  # Increase available memory for node to reduce ganache crashes
  # https://nodejs.org/api/cli.html#cli_max_old_space_size_size_in_megabytes
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  # ╔══════════════════════════════════════════════════════════════════════════════╗
  # ║                                  LINTER                                      ║
  # ╚══════════════════════════════════════════════════════════════════════════════╝
  lint:
    name: Contracts Linter
    runs-on: ubuntu-latest
    # Skip on scheduled runs (only need to lint on actual code changes)
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run Linter
        run: forge fmt --check

  # ╔══════════════════════════════════════════════════════════════════════════════╗
  # ║                                   BUILD                                      ║
  # ╚══════════════════════════════════════════════════════════════════════════════╝
  build:
    name: Contracts Build
    runs-on: ubuntu-latest
    # Skip on scheduled runs
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-pnpm: 'true'

      - name: Compile all contracts
        run: forge build

      - name: Ensure contract sizes are within limits
        # LidoARM/EtherFiARM/OriginARM are skipped: they sit at/over the EIP-170 runtime limit and are
        # being superseded by MultiAssetARM, so they should not gate CI.
        run: forge build --sizes --skip "test/**" --skip "script/**" --skip "*/forge-std/*" --skip "**/LidoARM.sol" --skip "**/EtherFiARM.sol" --skip "**/OriginARM.sol"

  # ╔══════════════════════════════════════════════════════════════════════════════╗
  # ║                              CONCRETE TESTS                                  ║
  # ╚══════════════════════════════════════════════════════════════════════════════╝
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Skip on scheduled runs
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-pnpm: 'true'

      - name: Run unit tests
        run: forge test --summary --fail-fast --show-progress --mp 'test/unit/**'

  fork-tests:
    name: Fork Tests
    runs-on: ubuntu-latest
    env:
      MAINNET_URL: ${{ secrets.MAINNET_URL }}
      FLY_API_KEY: ${{ secrets.FLY_API_KEY }}
      SONIC_URL: ${{ secrets.SONIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-pnpm: 'true'

      - name: Run fork tests
        run: forge test --summary --fail-fast --show-progress --mp 'test/fork/**'

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    env:
      MAINNET_URL: ${{ secrets.MAINNET_URL }}
      FLY_API_KEY: ${{ secrets.FLY_API_KEY }}
      SONIC_URL: ${{ secrets.SONIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-pnpm: 'true'

      - name: Run smoke tests
        run: forge build && forge test --summary --fail-fast --show-progress --mp 'test/smoke/**'

  # ╔══════════════════════════════════════════════════════════════════════════════╗
  # ║                              INVARIANT TESTS                                 ║
  # ╚══════════════════════════════════════════════════════════════════════════════╝
  # Profile selection:
  #   - ci:   schedule, workflow_dispatch (full runs; Medusa fuzzing only runs here)
  #   - lite: pull_request, push (including main; the nightly schedule already runs ci on main daily)

  invariant-tests-LidoARM:
    name: Invariant Tests - LidoARM
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ci' || 'lite' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run invariant tests (LidoARM) [${{ env.FOUNDRY_PROFILE }}]
        run: |
          FOUNDRY_INVARIANT_FAIL_ON_REVERT=true \
          FOUNDRY_MATCH_CONTRACT=FuzzerFoundry_LidoARM \
          forge test --summary --fail-fast --show-progress

  invariant-tests-EthenaARM:
    name: Invariant Tests - EthenaARM
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ci' || 'lite' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run invariant tests (EthenaARM) [${{ env.FOUNDRY_PROFILE }}]
        run: |
          FOUNDRY_INVARIANT_FAIL_ON_REVERT=true \
          FOUNDRY_MATCH_CONTRACT=FuzzerFoundry_EthenaARM \
          forge test --summary --fail-fast --show-progress

      # Medusa fuzzing (only on full runs)
      - name: Set up Python
        if: env.FOUNDRY_PROFILE == 'ci'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Crytic Compile
        if: env.FOUNDRY_PROFILE == 'ci'
        # Pinned so a new PyPI release cannot change the compiler Medusa drives.
        # To bump: take the latest version from https://pypi.org/project/crytic-compile/
        # and re-check test/invariants/EthenaARM/medusa.json against the Medusa release used below.
        run: pip install crytic-compile==0.4.2

      - name: Install Medusa (pinned release binary)
        if: env.FOUNDRY_PROFILE == 'ci'
        env:
          # To bump: pick the newest non-prerelease tag (`gh release list -R crytic/medusa --limit 5`),
          # then set MEDUSA_SHA256 to the `digest` of its medusa-linux-x64.tar.gz asset
          # (`gh release view <tag> -R crytic/medusa --json assets`). Change both together.
          MEDUSA_VERSION: v1.5.1
          MEDUSA_SHA256: ddfe1517ae9028ef9fc331b00f5a6a9d5406f3fcd11a715d60c6b6fb3e4546d3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/medusa-linux-x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/crytic/medusa/releases/download/${MEDUSA_VERSION}/medusa-linux-x64.tar.gz"
          echo "${MEDUSA_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" medusa
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/medusa" "$HOME/.local/bin/medusa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/medusa" --version

      - name: Run Medusa
        if: env.FOUNDRY_PROFILE == 'ci'
        working-directory: test/invariants/EthenaARM/
        run: medusa fuzz --timeout 1800 --seq-len 500 --fail-fast
