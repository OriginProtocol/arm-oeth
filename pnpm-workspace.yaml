autoInstallPeers: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@oplabs/talos-client'

# Security floors for transitive dependencies flagged by Dependabot. Each
# selector only matches the vulnerable range and lifts it to the first patched
# release, so nothing else moves. Once an upstream package ships the fix
# itself, its entry becomes a no-op and can be dropped.
#
# Not overridden on purpose: uuid 8 (Hardhat only uses v4, the bug is in
# v3/v5/v6; the fix is in 11.x) and elliptic (no patched release).
overrides:
  # ws is scoped by parent so peer ranges such as `ws: "*"` are left alone.
  "hardhat>ws": "^7.5.11"
  "ethers>ws": "^8.21.0"
  "@ethersproject/providers>ws": "^8.21.0"
  # Hardhat 2 pins undici 5 (its RPC HTTP client); every fix is in 6.x only.
  # Checked against a mainnet read (`snap`) and a fork write (`collectFees`).
  # This also removes @fastify/busboy, which undici 6 no longer depends on.
  "hardhat>undici": "^6.28.1"
  "immutable@>=4.0.0 <4.3.9": "^4.3.9"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "fast-xml-builder@<1.1.7": "^1.1.7"
  "follow-redirects@<1.16.0": "^1.16.0"
  # Other Hardhat internals: compiler download, telemetry, solc-js, crypto
  "adm-zip@<0.6.1": "^0.6.1"
  "tmp@<0.2.6": "^0.2.6"
  "cookie@<0.7.0": "^0.7.0"
  "pbkdf2@<3.1.7": "^3.1.7"
  # Dev tooling (mocha, eslint)
  "brace-expansion@>=1.0.0 <1.1.21": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  # mocha 10 pins serialize-javascript 6.x; the fix only exists in 7.x
  # (Node >= 20), which keeps the same API.
  "serialize-javascript@<7.0.5": "^7.0.5"
